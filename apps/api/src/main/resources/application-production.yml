spring:
  datasource:
    url: ${MINDSAGE_DATABASE_URL}
    username: ${MINDSAGE_DATABASE_USERNAME}
    password: ${MINDSAGE_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

mindsage:
  security:
    allowed-origins: ${MINDSAGE_ALLOWED_ORIGINS}
