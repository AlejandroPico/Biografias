spring:
  application:
    name: mindsage-api
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

mindsage:
  security:
    allowed-origins: ${MINDSAGE_ALLOWED_ORIGINS:http://localhost:4200,https://alejandropico.github.io}
